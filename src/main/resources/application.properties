server.port=8080

# JWT Configuration (set via environment variable JWT_SECRET in production)
jwt.secret=${JWT_SECRET:ChangeThisToASecureRandomSecretKeyThatIsAtLeast256BitsLong!}
jwt.access-token-expiry-ms=3600000
jwt.refresh-token-expiry-ms=604800000

# Firebase Configuration (set via environment variable in production)
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:firebase-service-account-key.json}
firebase.storage.bucket=${FIREBASE_STORAGE_BUCKET:your-project.appspot.com}

# BCrypt
security.bcrypt.strength=${BCRYPT_STRENGTH:12}

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.com.cryptovault=DEBUG
logging.level.org.springframework.security=INFO
