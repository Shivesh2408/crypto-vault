server.port=8080

# JWT Configuration
jwt.secret=CryptoVaultSecretKeyForJWTSigningMustBeAtLeast256BitsLong
jwt.access-token-expiry-ms=3600000
jwt.refresh-token-expiry-ms=604800000

# Firebase Configuration
firebase.credentials.path=firebase-service-account-key.json
firebase.storage.bucket=your-project.appspot.com

# Spring Security
spring.security.user.name=admin
spring.security.user.password=admin

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.com.cryptovault=DEBUG
logging.level.org.springframework.security=INFO
